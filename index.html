<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Loteamentos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="login" class="login-wrap hidden">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="brand-mark" id="loginLogo">L</div>
      <h1 id="loginEmpresa">Loteamentos</h1>
      <p class="sub">Loteamento Esperança I e II · Esperança/PB</p>
      <div id="loginMsg" class="notice hidden"></div>
      <div class="field" id="fNome" hidden>
        <label for="lNome">Nome</label>
        <input class="input" id="lNome" autocomplete="name">
      </div>
      <div class="field">
        <label for="lEmail">E-mail</label>
        <input class="input" id="lEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="lSenha">Senha</label>
        <input class="input" id="lSenha" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <button class="btn primary" style="width:100%" id="lBtn">Entrar</button>
      <div class="row" style="justify-content:space-between;margin-top:14px;font-size:.85rem">
        <a href="#" id="lToggle">Criar conta</a>
        <a href="#" id="lReset">Esqueci a senha</a>
      </div>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="navLogo">L</div>
        <div class="name" id="navEmpresa">Loteamentos</div>
      </div>
      <nav class="tabs-nav" id="nav"></nav>
      <span class="conn" id="conn">offline</span>
      <div class="user">
        <span id="navUser"></span>
        <button id="btnSair" class="btn sm">Sair</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
